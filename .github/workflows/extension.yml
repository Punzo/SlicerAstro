# Build 3D Slicer (Release, without the parts SlicerAstro does not use) and
# SlicerAstro on a GitHub Linux runner, and run the tests of SlicerAstro:
# - linux: Qt 6 (the Qt of SlicerAstroApp and of the macOS and Windows
#   packages of the Slicer factory);
# - linux-qt5: Qt 5 in Kitware's build environment
#   (slicer/buildenv-qt5-almalinux8-gcc14), the one of the Linux packages of
#   the Slicer factory, i.e. what Linux users of the extension get.
#
# 3D Slicer is built from source (about 3-5 hours the first time on the 4
# cores of a runner); the compiler cache (ccache, in the GitHub cache) makes
# the next runs much faster. If a first run stops at the time limit of the
# 3D Slicer build, run the workflow again: it continues from the cache.
name: Extension (Linux)

on:
  schedule:
    - cron: "0 3 * * 0"   # weekly, Sunday 03:00 UTC
  workflow_dispatch:
  push:
    branches: [master, update-slicer-5.13]
    paths-ignore: ["docs/**", "**.md"]

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      WORK: /mnt/work
      CCACHE_DIR: /mnt/work/ccache
      CCACHE_MAXSIZE: 4500M
      JOBS: 4
      # 3D Slicer build stopped in time to save the compiler cache
      SLICER_TIME_LIMIT: 290
    steps:
      - uses: actions/checkout@v4

      - name: Disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo mkdir -p "$WORK" && sudo chown "$USER" "$WORK"
          df -h / /mnt

      - name: System packages and Qt
        run: |
          .github/ci/install-system-packages.sh "$HOME/Qt" | tee qt.txt
          grep '^Qt6_DIR=' qt.txt >> "$GITHUB_ENV"

      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: /mnt/work/ccache
          key: ccache-linux-qt6-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-linux-qt6-

      - name: Build and test
        run: |
          set -o pipefail
          .github/ci/build-extension.sh "$GITHUB_WORKSPACE" "$WORK/build" 2>&1 | tee "$WORK/build.log"

      - name: Errors
        if: failure()
        run: bash .github/ci/annotate-errors.sh "$WORK/build.log" "Build and test errors"

      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /mnt/work/ccache
          key: ccache-linux-qt6-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: /mnt/work/build/SlicerAstro-build/inner-build/Testing/Temporary/
          if-no-files-found: ignore

  linux-qt5:
    name: linux-qt5 (Kitware build environment)
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      WORK: /mnt/work
      IMAGE: slicer/buildenv-qt5-almalinux8-gcc14:latest
      JOBS: 4
      SLICER_TIME_LIMIT: 290
    steps:
      - uses: actions/checkout@v4

      - name: Disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo mkdir -p "$WORK/ccache" && sudo chown -R "$USER" "$WORK"
          df -h / /mnt

      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: /mnt/work/ccache
          key: ccache-linux-qt5-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-linux-qt5-

      - name: Build and test (Kitware build environment)
        run: |
          set -o pipefail
          docker pull -q "$IMAGE"
          # the image provides Qt5_DIR (Qt 5.15.2 of the Qt installer, GCC 14)
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -v "$WORK:/work" \
            -e JOBS -e SLICER_TIME_LIMIT -e GITHUB_ACTIONS \
            -e CCACHE_DIR=/work/ccache -e CCACHE_MAXSIZE=4500M \
            "$IMAGE" bash -c '
              dnf install -y -q epel-release > /dev/null && dnf install -y -q ccache > /dev/null || echo "no ccache"
              /src/.github/ci/build-extension.sh /src /work/build
              status=$?
              chmod -R a+rwX /work
              exit $status' 2>&1 | tee "$WORK/build.log"

      - name: Errors
        if: failure()
        run: bash .github/ci/annotate-errors.sh "$WORK/build.log" "Build and test errors (Qt 5)"

      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /mnt/work/ccache
          key: ccache-linux-qt5-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-qt5
          path: /mnt/work/build/SlicerAstro-build/inner-build/Testing/Temporary/
          if-no-files-found: ignore
