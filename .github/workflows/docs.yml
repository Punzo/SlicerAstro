# Build the documentation (Sphinx, warnings are errors) on changes. The
# documentation is published by Read the Docs (.readthedocs.yaml).
name: Documentation

on:
  push:
    paths: ["docs/**", "vtkAstroReproject/Testing/validation/README.md", ".readthedocs.yaml", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "vtkAstroReproject/Testing/validation/README.md", ".readthedocs.yaml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - run: sphinx-build -W --keep-going -b html docs docs/_build/html
