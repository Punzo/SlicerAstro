# Read the Docs configuration (https://docs.readthedocs.io/en/stable/config-file/v2.html):
# the published documentation (latest = default branch, one version per
# release tag), as for the Slicer documentation.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  builder: html
  configuration: docs/conf.py
  fail_on_warning: true

formats:
  - pdf
  - epub

python:
  install:
    - requirements: docs/requirements.txt
